name: Finare CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: finare-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: windows-latest
    outputs:
      native: ${{ steps.coverage.outputs.native }}
      trusted: ${{ steps.coverage.outputs.trusted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Select required coverage for this revision
        id: coverage
        run: python -B tools/ci_policy.py plan --output artifacts/ci/plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: artifacts/ci/plan.json
          if-no-files-found: error

  managed-tests:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run Harness behavior and repository gates
        shell: powershell
        run: >-
          python -B tools/harness.py run
          --profile quick
          --require-clean
          --output ci-quick
      - name: Run managed tests and repository validator
        shell: powershell
        run: >-
          ./tools/run-ci-lane.ps1
          -Lane managed-tests
          -OutputDirectory artifacts/ci/managed-tests
          -RequireCleanTree
      - name: Validate the release-readiness provider contract
        shell: powershell
        run: >-
          ./tools/run-finare-release-readiness.ps1
          -PlanOnly
          -OutputDirectory artifacts/ci/managed-tests/release-readiness-plan
      - name: Upload managed lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-managed-tests
          path: |
            artifacts/harness/runs/ci-quick/**/*.json
            artifacts/harness/runs/ci-quick/**/*.log
            artifacts/harness/runs/ci-quick/**/*.md
            artifacts/ci/managed-tests/**/*.json
            artifacts/ci/managed-tests/**/*.log
            artifacts/ci/managed-tests/**/*.md
            artifacts/ci/managed-tests/**/*.trx
          if-no-files-found: error

  deterministic-generation:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run generation twice and compare checked artifacts
        shell: powershell
        run: >-
          ./tools/run-ci-lane.ps1
          -Lane deterministic-generation
          -OutputDirectory artifacts/ci/deterministic-generation
          -RequireCleanTree
      - name: Upload generation lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-deterministic-generation
          path: |
            artifacts/ci/deterministic-generation/**/*.json
            artifacts/ci/deterministic-generation/**/*.log
          if-no-files-found: error

  unreal:
    needs: plan
    # Fork code stays off persistent UE hosts. Required but unavailable coverage
    # fails CI acceptance; it is never silently reclassified as optional.
    if: needs.plan.outputs.trusted == 'true' && needs.plan.outputs.native != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.native) }}
    runs-on: [self-hosted, Windows, X64, ue-5.8.1]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Run UE release-candidate lane
        shell: powershell
        run: >-
          ./tools/run-ci-lane.ps1
          -Lane '${{ matrix.lane }}'
          -OutputDirectory 'artifacts/ci/${{ matrix.lane }}'
          -RequireCleanTree
      - name: Upload UE lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ matrix.lane }}
          path: |
            artifacts/ci/${{ matrix.lane }}/**/*.json
            artifacts/ci/${{ matrix.lane }}/**/*.md
            artifacts/ci/${{ matrix.lane }}/**/*.log
            artifacts/ci/${{ matrix.lane }}/**/*.trx
            artifacts/ci/${{ matrix.lane }}/**/*.txt
          if-no-files-found: error

  acceptance:
    name: CI acceptance
    if: always()
    needs: [plan, managed-tests, deterministic-generation, unreal]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-*
          path: artifacts/ci-evidence
      - name: Reject failed, skipped, missing or stale required evidence
        if: always()
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python -B tools/ci_policy.py verify
          --plan artifacts/ci-evidence/ci-plan/plan.json
          --reports artifacts/ci-evidence
          --output artifacts/ci-verdict.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-verdict
          path: artifacts/ci-verdict.json
          if-no-files-found: error
